<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/vergex-flow.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vergex — Intelligence that trades</title>
    <script>
      // Set the theme before the first paint so a dark page never flashes
      // white. Mirrors ThemeContext (key vergex-theme: system | light | dark).
      try {
        var saved = localStorage.getItem('vergex-theme')
        var dark =
          saved === 'dark' ||
          (saved !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
