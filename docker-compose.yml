services:
  # Database. Reached only over the internal network.
  vergex-postgres:
    image: postgres:17-alpine
    container_name: vergex-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-vergex}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?run make init to generate DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-vergex}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - vergex-postgres:/var/lib/postgresql/data
    networks:
      - vergex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Backend service (API and core logic)
  vergex-backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    image: vergex-backend
    container_name: vergex-backend
    restart: unless-stopped
    stop_grace_period: 30s  # Allow the app 30 seconds for graceful shutdown
    # The backend is reached through the frontend proxy (/api/). To expose it
    # directly for debugging, uncomment the mapping below.
    # ports:
    #   - "${VERGEX_BIND_ADDRESS:-127.0.0.1}:${VERGEX_BACKEND_PORT:-3000}:3000"
    volumes:
      # Configuration comes from env_file only; .env is not mounted.
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - VERGEX_AGENT_MAX_TOKENS=${VERGEX_AGENT_MAX_TOKENS:-8000}
      # Set DB_HOST and DB_PORT in .env to use an existing PostgreSQL server.
      - DB_HOST=${DB_HOST:-vergex-postgres}
      - DB_PORT=${DB_PORT:-5432}
    depends_on:
      vergex-postgres:
        condition: service_healthy
    networks:
      - vergex-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy)
  vergex-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    image: vergex-frontend
    container_name: vergex-frontend
    restart: unless-stopped
    ports:
      - "${VERGEX_BIND_ADDRESS:-127.0.0.1}:${VERGEX_FRONTEND_PORT:-8000}:80"
    networks:
      - vergex-network
    depends_on:
      - vergex-backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  vergex-postgres:

networks:
  vergex-network:
    driver: bridge
